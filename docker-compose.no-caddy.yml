########################################################################################
#
# This compose file runs every service separately without any reverse proxy or http
# server to serve user uploaded files. It is intended as a starting point for people
# who want to use their own reverse proxy and run Jadawel with one service per
# container. The web-frontend service is available by default at http://localhost:3000
# and the backend service is available by default at http://localhost:8000 .
#
# To use this file you need to:
#   1. Set the PUBLIC_BACKEND_URL to the URL that the user's browser can access the
#      backend service on.
#   2. Set the PUBLIC_WEB_FRONTEND_URL to the URL that the user's browser can access the
#      web-frontend service on.
#   3. Host the media files in the media volume on a HTTP server and set the MEDIA_URL
#      to the URL the user's browser can access the files on.
#   4. Ensure requests sent to the backend in /ws path are upgraded to websocket
#      connections.
#
# Example reverse-proxy configurations live under `deploy/nginx/` and `deploy/apache/`.
#
# The `backend` and `web-frontend` images are built from this repository - there is no
# published registry image for Jadawel. Build them with:
#   docker compose -f docker-compose.no-caddy.yml build --parallel
#
########################################################################################

# Backend environment variables and their defaults are documented inline below.
x-backend-variables:
  &backend-variables # Most users should only need to set these first four variables.
  SECRET_KEY: ${SECRET_KEY:?}
  JADAWEL_JWT_SIGNING_KEY: ${JADAWEL_JWT_SIGNING_KEY:-}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL-http://localhost:8000}
  PUBLIC_WEB_FRONTEND_URL: ${PUBLIC_WEB_FRONTEND_URL-http://localhost:3000}
  JADAWEL_EMBEDDED_SHARE_URL:

  # Set these if you want to use an external postgres instead of the db service below.
  DATABASE_USER: ${DATABASE_USER:-jadawel}
  DATABASE_NAME: ${DATABASE_NAME:-jadawel}
  DATABASE_HOST:
  DATABASE_PORT:
  DATABASE_OPTIONS:
  DATABASE_URL:
  JADAWEL_CONN_MAX_AGE:

  # Set these if you want to use an external redis instead of the redis service below.
  REDIS_HOST:
  REDIS_PORT:
  REDIS_PROTOCOL:
  REDIS_URL:
  REDIS_USER:
  REDIS_SSL_CERT_REQS:
  REDIS_SSL_CA_CERTS:
  JADAWEL_MCP_PROTECTION_VAULT:
  JADAWEL_MCP_PROTECTION_REDIS_URL: ${JADAWEL_MCP_PROTECTION_REDIS_URL:-redis://:${REDIS_PASSWORD}@mcp-protection-redis:6379/0}
  JADAWEL_MCP_PROTECTION_FINGERPRINT_KEYS:
  JADAWEL_MCP_PROTECTION_ACTIVE_KEY_ID:
  JADAWEL_MCP_PROTECTION_ALLOW_SHARED_REDIS:

  # Set these to enable Jadawel to send emails.
  EMAIL_SMTP:
  EMAIL_SMTP_HOST:
  EMAIL_SMTP_PORT:
  EMAIL_SMTP_USE_TLS:
  EMAIL_SMTP_USE_SSL:
  EMAIL_SMTP_USER:
  EMAIL_SMTP_PASSWORD:
  EMAIL_SMTP_SSL_CERTFILE_PATH:
  EMAIL_SMTP_SSL_KEYFILE_PATH:
  FROM_EMAIL:

  # Set these to use AWS S3 bucket to store user files.
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  AWS_STORAGE_BUCKET_NAME:
  AWS_S3_REGION_NAME:
  AWS_S3_ENDPOINT_URL:
  AWS_S3_CUSTOM_DOMAIN:

  # Misc settings - see the inline comments below for defaults
  JADAWEL_AMOUNT_OF_WORKERS:
  JADAWEL_ROW_PAGE_SIZE_LIMIT:
  BATCH_ROWS_SIZE_LIMIT:
  INITIAL_TABLE_DATA_LIMIT:
  JADAWEL_FILE_UPLOAD_SIZE_LIMIT_MB:
  JADAWEL_IMPORT_ARCHIVE_MAX_UNCOMPRESSED_SIZE_MB:
  JADAWEL_IMPORT_ARCHIVE_MAX_JSON_SIZE_MB:
  JADAWEL_FILE_UPLOAD_ACTIVE_CONTENT_POLICY:
  JADAWEL_OPENAI_UPLOADED_FILE_SIZE_LIMIT_MB:
  JADAWEL_UNIQUE_ROW_VALUES_SIZE_LIMIT:

  JADAWEL_AUTOMATION_HISTORY_PAGE_SIZE_LIMIT:
  JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_MAX_RUNS:
  JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMITS:
  JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
  JADAWEL_AUTOMATION_WORKFLOW_HISTORY_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
  JADAWEL_AUTOMATION_WORKFLOW_ERROR_LIMITS:
  JADAWEL_AUTOMATION_WORKFLOW_MAX_CONSECUTIVE_ERRORS:
  JADAWEL_AUTOMATION_WORKFLOW_TIMEOUT_HOURS:
  JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_DAYS:
  JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_ENTRIES:
  JADAWEL_AUTOMATION_WORKFLOW_HISTORY_CLEANUP_INTERVAL_MINUTES:

  JADAWEL_EXTRA_ALLOWED_HOSTS:
  ADDITIONAL_APPS:
  JADAWEL_PLUGIN_GIT_REPOS:
  JADAWEL_PLUGIN_URLS:

  JADAWEL_ENABLE_SECURE_PROXY_SSL_HEADER:
  MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
  SYNC_TEMPLATES_ON_STARTUP: ${SYNC_TEMPLATES_ON_STARTUP:-true}
  JADAWEL_SYNC_TEMPLATES_PATTERN:
  DONT_UPDATE_FORMULAS_AFTER_MIGRATION:
  JADAWEL_TRIGGER_SYNC_TEMPLATES_AFTER_MIGRATION:
  JADAWEL_SYNC_TEMPLATES_TIME_LIMIT:

  JADAWEL_BACKEND_DEBUG:
  JADAWEL_BACKEND_LOG_LEVEL:
  JADAWEL_DJANGO_REQUEST_LOG_LEVEL:
  FEATURE_FLAGS:
  JADAWEL_ENABLE_OTEL:
  JADAWEL_DEPLOYMENT_ENV:
  OTEL_EXPORTER_OTLP_ENDPOINT:
  OTEL_RESOURCE_ATTRIBUTES:
  POSTHOG_PROJECT_API_KEY:
  POSTHOG_HOST:

  PRIVATE_BACKEND_URL: http://backend:8000
  JADAWEL_PUBLIC_URL:
  MEDIA_URL:
  MEDIA_ROOT:

  JADAWEL_AIRTABLE_IMPORT_SOFT_TIME_LIMIT:
  HOURS_UNTIL_TRASH_PERMANENTLY_DELETED:
  OLD_ACTION_CLEANUP_INTERVAL_MINUTES:
  MINUTES_UNTIL_ACTION_CLEANED_UP:
  JADAWEL_GROUP_STORAGE_USAGE_QUEUE:
  DISABLE_ANONYMOUS_PUBLIC_VIEW_WS_CONNECTIONS:
  JADAWEL_WAIT_INSTEAD_OF_409_CONFLICT_ERROR:
  JADAWEL_DISABLE_MODEL_CACHE:
  JADAWEL_PLUGIN_DIR:
  JADAWEL_JOB_EXPIRATION_TIME_LIMIT:
  JADAWEL_JOB_CLEANUP_INTERVAL_MINUTES:
  JADAWEL_ROW_HISTORY_CLEANUP_INTERVAL_MINUTES:
  JADAWEL_ROW_HISTORY_RETENTION_DAYS:
  JADAWEL_USER_LOG_ENTRY_CLEANUP_INTERVAL_MINUTES:
  JADAWEL_USER_LOG_ENTRY_RETENTION_DAYS:
  JADAWEL_IMPORT_EXPORT_RESOURCE_CLEANUP_INTERVAL_MINUTES:
  JADAWEL_IMPORT_EXPORT_RESOURCE_REMOVAL_AFTER_DAYS:
  JADAWEL_IMPORT_EXPORT_TABLE_ROWS_COUNT_LIMIT:
  JADAWEL_MAX_ROW_REPORT_ERROR_COUNT:
  JADAWEL_JOB_SOFT_TIME_LIMIT:
  JADAWEL_FRONTEND_JOBS_POLLING_TIMEOUT_MS:
  JADAWEL_INITIAL_CREATE_SYNC_TABLE_DATA_LIMIT:
  JADAWEL_WEBHOOKS_ALLOW_PRIVATE_ADDRESS:
  JADAWEL_WEBHOOKS_IP_BLACKLIST:
  JADAWEL_WEBHOOKS_IP_WHITELIST:
  JADAWEL_WEBHOOKS_URL_REGEX_BLACKLIST:
  JADAWEL_WEBHOOKS_URL_CHECK_TIMEOUT_SECS:
  JADAWEL_WEBHOOKS_MAX_CONSECUTIVE_TRIGGER_FAILURES:
  JADAWEL_WEBHOOKS_MAX_RETRIES_PER_CALL:
  JADAWEL_WEBHOOKS_MAX_PER_TABLE:
  JADAWEL_WEBHOOKS_MAX_CALL_LOG_ENTRIES:
  JADAWEL_WEBHOOKS_REQUEST_TIMEOUT_SECONDS:
  JADAWEL_INTEGRATIONS_ALLOW_PRIVATE_ADDRESS:
  JADAWEL_INTEGRATIONS_PERIODIC_MINUTE_MIN:
  JADAWEL_ENTERPRISE_AUDIT_LOG_CLEANUP_INTERVAL_MINUTES:
  JADAWEL_ENTERPRISE_AUDIT_LOG_RETENTION_DAYS:
  JADAWEL_ALLOW_MULTIPLE_SSO_PROVIDERS_FOR_SAME_ACCOUNT:
  JADAWEL_SEAT_USAGE_JOB_CRONTAB:
  JADAWEL_PERIODIC_FIELD_UPDATE_CRONTAB:
  JADAWEL_PERIODIC_FIELD_UPDATE_UNUSED_WORKSPACE_INTERVAL_MIN:
  JADAWEL_PERIODIC_FIELD_UPDATE_TIMEOUT_MINUTES:
  JADAWEL_PERIODIC_FIELD_UPDATE_QUEUE_NAME:
  JADAWEL_MAX_CONCURRENT_USER_REQUESTS:
  JADAWEL_CONCURRENT_USER_REQUESTS_THROTTLE_TIMEOUT:
  JADAWEL_THROTTLE_BLACKLIST_TTL_SECONDS:
  JADAWEL_CACHE_TTL_SECONDS:
  JADAWEL_THROTTLE_IP_ENABLED:
  JADAWEL_SEND_VERIFY_EMAIL_RATE_LIMIT:
  JADAWEL_LOGIN_ACTION_LOG_LIMIT:
  JADAWEL_OSS_ONLY:
  OTEL_TRACES_SAMPLER:
  OTEL_TRACES_SAMPLER_ARG:
  OTEL_PER_MODULE_SAMPLER_OVERRIDES:
  JADAWEL_CACHALOT_ENABLED:
  JADAWEL_CACHALOT_MODE:
  JADAWEL_CACHALOT_ONLY_CACHABLE_TABLES:
  JADAWEL_CACHALOT_UNCACHABLE_TABLES:
  JADAWEL_CACHALOT_TIMEOUT:
  JADAWEL_BUILDER_PUBLICLY_USED_PROPERTIES_CACHE_TTL_SECONDS:
  JADAWEL_BUILDER_DISPATCH_ACTION_CACHE_TTL_SECONDS:
