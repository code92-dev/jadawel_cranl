  JADAWEL_ENTERPRISE_ASSISTANT_LLM_TEMPERATURE:
  JADAWEL_EMBEDDINGS_API_URL:

services:
  backend:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:8000:8000"
    environment:
      <<: *backend-variables
    depends_on:
      - db
      - redis
      - mcp-protection-redis
    volumes:
      - media:/jadawel/media
    networks:
      local:

  web-frontend:
    image: jadawel/web-frontend:${JADAWEL_VERSION:-2.2.2}
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: prod
    restart: unless-stopped
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:3000:3000"
    environment:
      JADAWEL_PUBLIC_URL:
      MEDIA_URL:
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
      PUBLIC_BACKEND_URL:
      PUBLIC_WEB_FRONTEND_URL:
      JADAWEL_EMBEDDED_SHARE_URL:
      JADAWEL_DISABLE_PUBLIC_URL_CHECK:
      INITIAL_TABLE_DATA_LIMIT:
      DOWNLOAD_FILE_VIA_XHR:
      JADAWEL_DISABLE_GOOGLE_DOCS_FILE_PREVIEW:
      JADAWEL_DISABLE_SUPPORT:
      JADAWEL_EXTRA_CLIENT_SCRIPT_URLS:
      HOURS_UNTIL_TRASH_PERMANENTLY_DELETED:
      DISABLE_ANONYMOUS_PUBLIC_VIEW_WS_CONNECTIONS:
      FEATURE_FLAGS:
      ADDITIONAL_MODULES:
      JADAWEL_MAX_IMPORT_FILE_SIZE_MB:
      JADAWEL_MAX_SNAPSHOTS_PER_GROUP:
      JADAWEL_ENABLE_OTEL:
      JADAWEL_DEPLOYMENT_ENV:
      JADAWEL_OSS_ONLY:
      JADAWEL_USE_PG_FULLTEXT_SEARCH:
      JADAWEL_PG_FULLTEXT_SEARCH_UPDATE_DATA_THROTTLE_SECONDS:
      JADAWEL_UNIQUE_ROW_VALUES_SIZE_LIMIT:
      JADAWEL_ROW_PAGE_SIZE_LIMIT:
      JADAWEL_INTEGRATION_LOCAL_JADAWEL_PAGE_SIZE_LIMIT:
      JADAWEL_INTEGRATION_ALLOW_SMTP_SERVICE_TO_USE_INSTANCE_SETTINGS:
      JADAWEL_INTEGRATIONS_PERIODIC_MINUTE_MIN:
      JADAWEL_BUILDER_DOMAINS:
      JADAWEL_FRONTEND_SAME_SITE_COOKIE:
      JADAWEL_AUTOMATION_HISTORY_PAGE_SIZE_LIMIT:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_MAX_RUNS:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMITS:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
      JADAWEL_AUTOMATION_WORKFLOW_ERROR_LIMITS:
      JADAWEL_AUTOMATION_WORKFLOW_MAX_CONSECUTIVE_ERRORS:
      JADAWEL_AUTOMATION_WORKFLOW_TIMEOUT_HOURS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_DAYS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_ENTRIES:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_CLEANUP_INTERVAL_MINUTES:
    depends_on:
      - backend
    networks:
      local:

  celery:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    environment:
      <<: *backend-variables
    command: celery-worker
    # The backend image's baked in healthcheck defaults to the django healthcheck
    # override it to the celery one here.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/jadawel/backend/docker/docker-entrypoint.sh celery-worker-healthcheck",
        ]
    depends_on:
      - backend
    volumes:
      - media:/jadawel/media
    networks:
      local:

  celery-export-worker:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    command: celery-exportworker
    environment:
      <<: *backend-variables
    # The backend image's baked in healthcheck defaults to the django healthcheck
    # override it to the celery one here.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/jadawel/backend/docker/docker-entrypoint.sh celery-exportworker-healthcheck",
        ]
    depends_on:
      - backend
    volumes:
      - media:/jadawel/media
    networks:
      local:

  celery-beat-worker:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    command: celery-beat
    environment:
      <<: *backend-variables
    # See https://github.com/sibson/redbeat/issues/129#issuecomment-1057478237
    stop_signal: SIGQUIT
    depends_on:
      - backend
    volumes:
      - media:/jadawel/media
    networks:
      local:

  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DATABASE_USER:-jadawel}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?}
      - POSTGRES_DB=${DATABASE_NAME:-jadawel}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'su postgres -c "pg_isready -U ${DATABASE_USER:-jadawel}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      local:
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:6
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      local:

  mcp-protection-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${JADAWEL_MCP_PROTECTION_REDIS_MEM_LIMIT:-256m}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?} --maxmemory 128mb
      --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      local:
    volumes:
      - mcp_protection_redisdata:/data

  # By default, the media volume will be owned by root on startup. Ensure it is owned by
  # the same user that django is running as, so it can write user files.
  volume-permissions-fixer:
    image: bash:4.4
    command: chown 9999:9999 -R /jadawel/media
    volumes:
      - media:/jadawel/media
    networks:
      local:

volumes:
  pgdata:
  mcp_protection_redisdata:
  media:
  caddy_data:
  caddy_config:

networks:
  local:
    driver: bridge
