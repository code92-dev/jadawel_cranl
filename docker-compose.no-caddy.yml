  JADAWEL_PERSONAL_VIEW_LOWEST_ROLE_ALLOWED:
  JADAWEL_DISABLE_LOCKED_MIGRATIONS:
  JADAWEL_USE_PG_FULLTEXT_SEARCH:
  JADAWEL_PG_FULLTEXT_SEARCH_UPDATE_DATA_THROTTLE_SECONDS:
  JADAWEL_BUILDER_DOMAINS:
  JADAWEL_ICAL_VIEW_MAX_EVENTS: ${JADAWEL_ICAL_VIEW_MAX_EVENTS:-}
  JADAWEL_WEBHOOK_ROWS_ENTER_VIEW_BATCH_SIZE:
