services:
  # A caddy reverse proxy sitting in-front of all the services. Responsible for routing
  # requests to either the backend or web-frontend and also serving user uploaded files
  # from the media volume.
  caddy:
    image: jadawel/caddy:${JADAWEL_VERSION:-2.2.2}
    build:
      dockerfile: ./Caddy.Dockerfile
      context: .
    restart: unless-stopped
    mem_limit: ${JADAWEL_CADDY_MEM_LIMIT:-192m}
    environment:
      # Controls what port the Caddy server binds to inside its container.
      JADAWEL_CADDY_ADDRESSES: ${JADAWEL_CADDY_ADDRESSES:-:80}
      PRIVATE_WEB_FRONTEND_URL: ${PRIVATE_WEB_FRONTEND_URL:-http://web-frontend:3000}
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
      JADAWEL_PUBLIC_URL: ${JADAWEL_PUBLIC_URL:-}
      MEDIA_URL: ${MEDIA_URL:-}
    expose:
      - "80"
    volumes:
      - media:/jadawel/media
      - caddy_config:/config
      - caddy_data:/data
    # RETIRED. These Traefik labels configured the Coolify deployment at
    # jadawel.azoz.cloud, which has been switched off and will not be used
    # again. Nothing reads them today: CranL terminates TLS itself and routes
    # straight to the container, so it needs no proxy labels at all — see
    # docs/DEPLOY_CRANL.md. Left in place because they are the reference for the
    # rate limiting and TLS wiring if the fork is ever self-hosted again; the
    # hostnames below are the old domain and would need changing first.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.middlewares.jadawel-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.jadawel-http.entrypoints=http"
      - "traefik.http.routers.jadawel-http.middlewares=jadawel-redirect"
      - "traefik.http.routers.jadawel-http.rule=Host(`jadawel.azoz.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.jadawel-http.service=jadawel"
      - "traefik.http.routers.jadawel-https.entrypoints=https"
      - "traefik.http.routers.jadawel-https.middlewares=gzip"
      - "traefik.http.routers.jadawel-https.rule=Host(`jadawel.azoz.cloud`) && PathPrefix(`/`)"
      - "traefik.http.routers.jadawel-https.service=jadawel"
      # Brute-force protection. Jadawel does not rate limit failed logins at all
      # by default, so credential stuffing against /api/user/token-auth/ is
      # limited only by network speed. This router matches just the credential
      # endpoints and is declared with a higher priority than the catch-all
      # above so it wins for those paths.
      #
      # 5 req/s average with a burst of 20, per client IP. Generous enough that
      # a real person signing in never sees it, and slow enough that guessing a
      # password stops being practical.
      - "traefik.http.middlewares.jadawel-auth-ratelimit.ratelimit.average=5"
      - "traefik.http.middlewares.jadawel-auth-ratelimit.ratelimit.burst=20"
      - "traefik.http.middlewares.jadawel-auth-ratelimit.ratelimit.period=1s"
      # Traefik sees Coolify's proxy in front of it, so the client IP has to be
      # read from the end of X-Forwarded-For rather than the socket, otherwise
      # every request shares one bucket and the whole site rate limits together.
      - "traefik.http.middlewares.jadawel-auth-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=1"
      - "traefik.http.routers.jadawel-auth.entrypoints=https"
      - "traefik.http.routers.jadawel-auth.priority=100"
      - "traefik.http.routers.jadawel-auth.rule=Host(`jadawel.azoz.cloud`) && (PathPrefix(`/api/user/token-auth/`) || PathPrefix(`/api/user/token-refresh/`) || PathPrefix(`/api/user/send-reset-password-email/`) || PathPrefix(`/api/user/reset-password/`))"
      - "traefik.http.routers.jadawel-auth.middlewares=gzip,jadawel-auth-ratelimit"
      - "traefik.http.routers.jadawel-auth.service=jadawel"
      - "traefik.http.routers.jadawel-auth.tls=true"
      - "traefik.http.routers.jadawel-auth.tls.certresolver=letsencrypt"
      - "traefik.http.routers.jadawel-https.tls=true"
      - "traefik.http.routers.jadawel-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.jadawel.loadbalancer.server.port=80"
    networks:
      local:
      coolify:

  backend:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: prod
    restart: unless-stopped
    mem_limit: ${JADAWEL_BACKEND_MEM_LIMIT:-1g}

    environment:
      <<: *backend-variables
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-protection-redis:
        condition: service_healthy
    volumes:
      - media:/jadawel/media
    networks:
      local:

  web-frontend:
    image: jadawel/web-frontend:${JADAWEL_VERSION:-2.2.2}
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: prod
    restart: unless-stopped
    mem_limit: ${JADAWEL_WEB_FRONTEND_MEM_LIMIT:-768m}
    environment:
      JADAWEL_PUBLIC_URL: ${JADAWEL_PUBLIC_URL-http://localhost}
      MEDIA_URL:
      JADAWEL_EXTRA_PUBLIC_URLS:
      PRIVATE_BACKEND_URL: ${PRIVATE_BACKEND_URL:-http://backend:8000}
      PUBLIC_BACKEND_URL:
      PUBLIC_WEB_FRONTEND_URL:
      JADAWEL_EMBEDDED_SHARE_URL:
      JADAWEL_DISABLE_PUBLIC_URL_CHECK:
      INITIAL_TABLE_DATA_LIMIT:
      DOWNLOAD_FILE_VIA_XHR:
      JADAWEL_DISABLE_GOOGLE_DOCS_FILE_PREVIEW:
      JADAWEL_DISABLE_SUPPORT:
      JADAWEL_EXTRA_CLIENT_SCRIPT_URLS:
      HOURS_UNTIL_TRASH_PERMANENTLY_DELETED:
      DISABLE_ANONYMOUS_PUBLIC_VIEW_WS_CONNECTIONS:
      FEATURE_FLAGS:
      ADDITIONAL_MODULES:
      JADAWEL_MAX_IMPORT_FILE_SIZE_MB:
      JADAWEL_MAX_SNAPSHOTS_PER_GROUP:
      JADAWEL_ENABLE_OTEL:
      JADAWEL_DEPLOYMENT_ENV:
      JADAWEL_OSS_ONLY:
      JADAWEL_USE_PG_FULLTEXT_SEARCH:
      JADAWEL_PG_FULLTEXT_SEARCH_UPDATE_DATA_THROTTLE_SECONDS:
      POSTHOG_PROJECT_API_KEY:
      POSTHOG_HOST:
      JADAWEL_UNIQUE_ROW_VALUES_SIZE_LIMIT:
      JADAWEL_ROW_PAGE_SIZE_LIMIT:
      JADAWEL_INTEGRATION_LOCAL_JADAWEL_PAGE_SIZE_LIMIT:
      JADAWEL_INTEGRATION_ALLOW_SMTP_SERVICE_TO_USE_INSTANCE_SETTINGS:
      JADAWEL_BUILDER_DOMAINS:
      JADAWEL_FRONTEND_SAME_SITE_COOKIE:
      SENTRY_DSN:
      JADAWEL_PREMIUM_GROUPED_AGGREGATE_SERVICE_MAX_SERIES:
      JADAWEL_PREMIUM_GROUPED_AGGREGATE_SERVICE_MAX_AGG_BUCKETS:
      JADAWEL_AUTOMATION_HISTORY_PAGE_SIZE_LIMIT:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_MAX_RUNS:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMITS:
      JADAWEL_AUTOMATION_WORKFLOW_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_RATE_LIMIT_CACHE_EXPIRY_SECONDS:
      JADAWEL_AUTOMATION_WORKFLOW_ERROR_LIMITS:
      JADAWEL_AUTOMATION_WORKFLOW_MAX_CONSECUTIVE_ERRORS:
      JADAWEL_AUTOMATION_WORKFLOW_TIMEOUT_HOURS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_DAYS:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_MAX_ENTRIES:
      JADAWEL_AUTOMATION_WORKFLOW_HISTORY_CLEANUP_INTERVAL_MINUTES:
      JADAWEL_INTEGRATIONS_PERIODIC_MINUTE_MIN:
      JADAWEL_ENTERPRISE_ASSISTANT_LLM_MODEL:
    depends_on:
      backend:
        condition: service_started
    networks:
      local:

  celery:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    mem_limit: ${JADAWEL_CELERY_MEM_LIMIT:-768m}
    environment:
      <<: *backend-variables
    command: celery-worker
    # The backend image's baked in healthcheck defaults to the django healthcheck
    # override it to the celery one here.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/jadawel/backend/docker/docker-entrypoint.sh celery-worker-healthcheck",
        ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/jadawel/media
    networks:
      local:

  celery-export-worker:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    mem_limit: ${JADAWEL_CELERY_EXPORT_MEM_LIMIT:-768m}
    command: celery-exportworker
    environment:
      <<: *backend-variables
    # The backend image's baked in healthcheck defaults to the django healthcheck
    # override it to the celery one here.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/jadawel/backend/docker/docker-entrypoint.sh celery-exportworker-healthcheck",
        ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/jadawel/media
    networks:
      local:

  celery-beat-worker:
    image: jadawel/backend:${JADAWEL_VERSION:-2.2.2}
    restart: unless-stopped
    mem_limit: ${JADAWEL_CELERY_BEAT_MEM_LIMIT:-384m}
    command: celery-beat
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/jadawel/backend/docker/docker-entrypoint.sh celery-beat-healthcheck",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *backend-variables
    # See https://github.com/sibson/redbeat/issues/129#issuecomment-1057478237
    stop_signal: SIGQUIT
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/jadawel/media
    networks:
      local:

  db:
    image: pgvector/pgvector:pg15
    # If you were using a previous version, perform the update by uncommenting the
    # following line. See the PostgreSQL upgrade notes for the pgautoupgrade image.
    # for more information.
    # image: pgautoupgrade/pgautoupgrade:15-alpine3.8
    restart: unless-stopped
    mem_limit: ${JADAWEL_DB_MEM_LIMIT:-1g}
    environment:
      - POSTGRES_USER=${DATABASE_USER:-jadawel}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:?}
      - POSTGRES_DB=${DATABASE_NAME:-jadawel}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'su postgres -c "pg_isready -U ${DATABASE_USER:-jadawel}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      local:
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    # redis:6 is past end of life. 7-alpine is the current supported line.
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${JADAWEL_REDIS_MEM_LIMIT:-256m}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?}
    # Append-only persistence so the RedBeat schedule and the throttle counters
    # survive a container recreation. Without a volume the scheduled backup
    # silently loses its next run time on every deploy.
    command: redis-server --requirepass ${REDIS_PASSWORD:?} --appendonly yes
    healthcheck:
      # Authenticated: a bare `redis-cli ping` against a password-protected
      # server answers NOAUTH, so the probe never actually tested the server.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      local:
    volumes:
      - redisdata:/data

  mcp-protection-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${JADAWEL_MCP_PROTECTION_REDIS_MEM_LIMIT:-256m}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD:?} --maxmemory 128mb
      --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      local:
    volumes:
      - mcp_protection_redisdata:/data

  # By default, the media volume will be owned by root on startup. Ensure it is owned by
  # the same user that django is running as, so it can write user files.
  volume-permissions-fixer:
    image: bash:4.4
    restart: unless-stopped
    mem_limit: ${JADAWEL_FIXER_MEM_LIMIT:-64m}
    command: sh -c "chown 9999:9999 -R /jadawel/media && exec sleep infinity"
    volumes:
      - media:/jadawel/media
    networks:
      local:

volumes:
  pgdata:
  redisdata:
  mcp_protection_redisdata:
  media:
  caddy_data:
  caddy_config:

networks:
  local:
    driver: bridge
  coolify:
    external: true
