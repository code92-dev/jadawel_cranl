  # Defaulted on. Left unset, Django never sees a request as HTTPS and gunicorn
  # never gets --forwarded-allow-ips, so REMOTE_ADDR is the proxy for every
  # request and nothing that counts per client — rate limits included — can
  # tell callers apart.
  JADAWEL_ENABLE_SECURE_PROXY_SSL_HEADER: ${JADAWEL_ENABLE_SECURE_PROXY_SSL_HEADER:-yes}
