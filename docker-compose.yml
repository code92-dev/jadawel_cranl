  # Defaults to off. Re-importing every template on each restart costs up to
  # half an hour of startup, which turns a routine restart into an outage.
  SYNC_TEMPLATES_ON_STARTUP: ${SYNC_TEMPLATES_ON_STARTUP:-false}
