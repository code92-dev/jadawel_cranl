services:
  db:
    # use lowest supported version for dev to check compatibility
    image: pgvector/pgvector:pg${POSTGRES_IMAGE_VERSION:-14}
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    command: "${POSTGRES_DEV_EXTRA_ARGS}"
    volumes:
      # Use a different volume in case the Major version is different from the
      # production one to avoid issues.
      - pgdatadev:/var/lib/postgresql/data

  redis:
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${DEBUG_REDIS_PORT:-6379}:6379"

  # Override with the dev caddy file which switches Caddy to only be the media file
  # server in the dev env. Devs will instead directly connect to the backend and
  # web frontend services.
  caddy:
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${WEB_FRONTEND_PORT:-4000}:80"
    volumes:
      - $PWD/Caddyfile.dev:/etc/caddy/Caddyfile

  backend:
    image: jadawel_backend:dev
    environment:
      - JADAWEL_BACKEND_DEBUGGER_ENABLED
      - JADAWEL_BACKEND_DEBUGGER_PORT=${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}
      - JADAWEL_ENABLE_SILK=${JADAWEL_ENABLE_SILK:-false}
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_EMBEDDINGS_API_URL=${JADAWEL_EMBEDDINGS_API_URL}
      # Off for local dev, which is plain http. The production compose defaults
      # it on, and with it come Secure cookies and HSTS — neither of which a
      # browser will honour over http://localhost, and HSTS on localhost sticks
      # around long after you stop working on this.
      - JADAWEL_ENABLE_SECURE_PROXY_SSL_HEADER=
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:8000:8000"
      - "${HOST_PUBLISH_IP:-127.0.0.1}:${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}:${JADAWEL_BACKEND_DEBUGGER_PORT:-5678}"
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      # Fork-hygiene tests inspect these upstream attribution sources from the
      # repository root. Keep the dev container's /jadawel tree faithful to the
      # checkout just like the CI image.
      - ./deploy/helm/jadawel:/jadawel/deploy/helm/jadawel:ro
      - ./formula:/jadawel/formula:ro
      - ./deploy/plugins/:/jadawel/plugins/
      - ./tests:/jadawel/tests
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  web-frontend:
    image: jadawel_web-frontend:dev
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    command: "nuxt-dev"
    environment:
      # The Nuxt dev server accumulates SSR state as pages are rendered, and a
      # full e2e run pushes its Nitro worker past Node's default heap ceiling.
      # Once that happens every page returns a 500 with "Worker terminated due
      # to reaching memory limit: JS heap out of memory" and the rest of the run
      # fails for reasons unrelated to the tests. Keep this below
      # JADAWEL_WEB_FRONTEND_MEM_LIMIT so the container is not OOM killed first.
      NODE_OPTIONS: ${JADAWEL_WEB_FRONTEND_NODE_OPTIONS:---max-old-space-size=4096}
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:3000:3000"
    volumes:
      - ./web-frontend:/jadawel/web-frontend
      - ./tests/:/jadawel/tests
      - ./deploy/plugins:/jadawel/plugins
      # dev volumes to avoid polluting your local filesystem with build files or
      # overwriting existing node_modules.
      - node_modules:/jadawel/web-frontend/node_modules
      - nuxt:/jadawel/web-frontend/.nuxt/
      - cache:/jadawel/web-frontend/.cache/
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  storybook:
    image: jadawel_web-frontend:dev
    profiles: ["optional"]
    build:
      dockerfile: ./web-frontend/Dockerfile
      context: .
      target: dev
      args:
        # We allow configuring the UID/GID here so you can run as the dev's actual user
        # reducing the chance the containers screw up the bind mounted folders.
        UID: $UID
        GID: $GID
    command: "storybook-dev"
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:6006:6006"
    volumes:
      - ./web-frontend:/jadawel/web-frontend
      - ./tests/:/jadawel/tests
      - ./deploy/plugins:/jadawel/plugins
      # dev volumes to avoid polluting your local filesystem with build files or
      # overwriting existing node_modules.
      - node_modules:/jadawel/web-frontend/node_modules
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:6006/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-worker"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_ENABLE_SILK=${JADAWEL_ENABLE_SILK:-false}
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
      # Without this celery spawns one worker per CPU core, and each one
      # loads the full Django app (~300 MB RSS). On a many-core host that
      # blows past the 768 MB container limit inherited from the production
      # compose: the pool gets OOM-killed mid-boot, watchmedo restarts it,
      # and realtime broadcasts (websocket events after every row change)
      # silently stop. Four workers fit comfortably and drain the dev queues.
      - JADAWEL_AMOUNT_OF_WORKERS=${JADAWEL_AMOUNT_OF_WORKERS:-4}
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  celery-export-worker:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-exportworker"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - JADAWEL_ENABLE_SILK=${JADAWEL_ENABLE_SILK:-false}
      - JADAWEL_DANGEROUS_SILKY_ANALYZE_QUERIES
      # See the celery service above: keep the export pool inside the
      # container's memory limit on many-core hosts.
      - JADAWEL_AMOUNT_OF_WORKERS=${JADAWEL_AMOUNT_OF_WORKERS:-4}
    volumes:
      - ./docs:/jadawel/docs
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true
    depends_on:
      - otel-collector

  celery-beat-worker:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    command: "watch-py celery-beat"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  celery-flower:
    image: jadawel_backend:dev
    user: "${UID}:${GID}"
    profiles: ["optional"]
    restart: unless-stopped
    stop_signal: SIGQUIT
    command: "celery-flower"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5555 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      REDIS_HOST:
      REDIS_PORT:
      REDIS_PROTOCOL:
      REDIS_URL:
      REDIS_SSL_CERT_REQS:
      REDIS_SSL_CA_CERTS:
      REDIS_USER:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - ./backend:/jadawel/backend
      - ./deploy/plugins:/jadawel/plugins
      - media:/jadawel/media
    ports:
      - "5555:5555" # web ui
    networks:
      local:
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  mjml-email-compiler:
    image: jadawel_web-frontend:dev
    depends_on:
      - web-frontend
    user: "${UID}:${GID}"
    command: "bash -c 'cd /jadawel/backend/email_compiler/ && yarn install && yarn run watch'"
    healthcheck:
      disable: true
    volumes:
      - ./backend:/jadawel/backend
      - ./web-frontend/docker:/jadawel/web-frontend/docker
      - ./deploy/plugins:/jadawel/plugins
    # Open stdin and tty so when attaching key input works as expected.
    stdin_open: true
    tty: true

  # Inbound email receiver (mox) for the "Start workflow by email" automation
  # trigger. Opt-in via the base file's "inbound-email" profile: `just mox up`
  # starts it next to a natively running backend, and
  # `COMPOSE_PROFILES=optional,inbound-email` starts it as part of
  # `just dc-dev up`. Same `email-receiver` role as production, but built from
  # the dev image so no Go toolchain or `brew install mox` is needed.
  email-receiver:
    image: jadawel_backend:dev
    # Inherited from the base file, repeated here so it is not mistaken for an
    # omission: the receiver only exists under this profile.
    profiles: ["inbound-email"]
    build:
      dockerfile: ./backend/Dockerfile
      context: .
      target: dev
      args:
        UID: $UID
        GID: $GID
    # The SMTP port mapping comes from the base file and is env-driven:
    # .env.docker-dev publishes it on 127.0.0.1:2025 (off port 25, like mailhog).
    # The web API is published on loopback too so a natively running backend
    # (`just dev`) can delete handed-over messages through it.
    ports:
      - "${JADAWEL_HOST_PUBLISH_IP:-127.0.0.1}:${JADAWEL_INBOUND_EMAIL_WEBAPI_HOST_PORT:-8880}:${JADAWEL_INBOUND_EMAIL_WEBAPI_PORT:-8880}"
    # Lets the container reach a backend running natively on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The dev image expects the source and plugin helpers bind-mounted, like
    # the backend service above.
    volumes:
      - ./backend:/jadawel/backend
      - ./deploy/plugins/:/jadawel/plugins/

  mailhog:
    image: mailhog/mailhog
    logging:
      driver: "none" # disable saving logs
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:1025:1025" # smtp
      - "8025:8025" # web ui
    networks:
      local:

  # When switching between dev and local the media files in the media volume will be
  # owned by different users. Ensure that we chown them to the user appropriate for the
  # environment here.
  volume-permissions-fixer:
    image: bash:4.4
    command: chown ${UID:-9999}:${GID:-9999}  -R /jadawel/media
    volumes:
      - media:/jadawel/media
      - caddy_config:/config
      - caddy_data:/data
    networks:
      local:

  otel-collector:
    image: otel/opentelemetry-collector:0.106.1
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      HONEYCOMB_API_KEY:
      HONEYCOMB_METRICS_DATASET: jadawel-dev-metrics
    volumes:
      - $PWD/deploy/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      local:
    ports:
      - "4318:4318"

  embeddings:
    profiles: ["ai"]
    build:
      context: ./embeddings
      dockerfile: Dockerfile
    ports:
      - "${HOST_PUBLISH_IP:-127.0.0.1}:7999:80"
    networks:
      local:
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost/health').raise_for_status()",
        ]
      interval: 1m30s
      timeout: 10s
      retries: 3

volumes:
  pgdatadev:
  node_modules:
  nuxt:
  storybook:
  cache:
