name: Publish all-in-one image

# Builds the Jadawel all-in-one image and pushes it to GHCR.
#
# This exists because the app cannot be built on the target host. The Nuxt
# production build peaks above 4 GB, which is more than a small PaaS app plan
# gets, so hosts like CranL OOM part-way through the frontend image. A
# GitHub-hosted runner has 16 GB, builds it comfortably, and the host then only
# has to pull the result.
#
# The `lite` variant (target `prod-lite`) is built deliberately: it drops the
# embedded Postgres and Redis, which are useless on a host without a persistent
# volume — see docs/DEPLOY_CRANL.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (also pushed as :latest)"
        required: true
        default: "latest"
      overwrite:
        description: "Allow republishing a tag that already exists"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push all-in-one-lite
    runs-on: ubuntu-latest
    # The three chained image builds take well over the default job budget on a
    # cold cache.
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The runner ships ~14 GB free, and three large images plus the build
      # cache do not fit. These toolchains are not used by any build here.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and tag
        id: meta
        # Both the repository name and the dispatch input arrive through the
        # environment rather than being interpolated into the script. A `${{ }}`
        # expansion is pasted in as shell source before bash ever sees it, so a
        # tag containing shell metacharacters would run as code on the runner.
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Derived from the repository rather than hardcoded: GHCR links a new
          # package to the repo that first pushes it, and GITHUB_TOKEN is only
          # guaranteed write access to that path. GHCR also rejects uppercase,
          # and the owner is `Azizahmed`.
          repo=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          if [ "$EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="$INPUT_TAG"
          fi
          case "$tag" in
            ''|*[!A-Za-z0-9._-]*)
              echo "Refusing tag '$tag': only A-Za-z0-9._- are allowed." >&2
              exit 1
              ;;
          esac
          echo "image=${{ env.REGISTRY }}/${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing tag
        # A tag that already exists is already deployed somewhere. Rebuilding it
        # repoints it, so the digest a Dockerfile pinned no longer matches what
        # the tag serves and two hosts on "the same version" run different code.
        # `latest` is exempt: it is mutable by definition.
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if [ "$TAG" = "latest" ] || [ "$OVERWRITE" = "true" ]; then
            echo "Skipping the check for tag '$TAG'."
            exit 0
          fi
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists. Publish a new tag, or re-run with 'overwrite' checked." >&2
            exit 1
          fi
          echo "Tag '$TAG' is free."

      # Built locally rather than pushed: these two are only inputs to the
      # all-in-one image, not deployable on their own.
      - name: Build backend (prod)
        run: docker build -f backend/Dockerfile --target prod -t jadawel/backend:build .

      - name: Build web-frontend (prod)
        run: docker build -f web-frontend/Dockerfile --target prod -t jadawel/web-frontend:build .

      - name: Build and push all-in-one-lite
        run: |
          docker build \
            -f deploy/all-in-one/Dockerfile --target prod-lite \
            --build-arg BACKEND_IMAGE=jadawel/backend:build \
            --build-arg WEBFRONTEND_IMAGE=jadawel/web-frontend:build \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            .
          # Fail before publishing if the standalone release plugins were omitted.
          docker run --rm --entrypoint python \
            -e SECRET_KEY=release-packaging-check \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" -c '
          import django
          django.setup()
          from django.urls import resolve
          from django.db.migrations.loader import MigrationLoader
          for route in ("/api/billing/admin/plans/", "/api/organizations/admin/"):
              print(route, resolve(route).view_name)
          migrations = MigrationLoader(None).disk_migrations
          for app in ("jadawel_billing", "jadawel_organizations"):
              assert any(label == app for label, name in migrations), app
          '
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG" 2>/dev/null || true)
          {
            echo "Pushed \`$IMAGE:$TAG\`"
            echo ""
            if [ -n "$digest" ]; then
              # The digest, not the tag: `:latest` is republished on every run
              # and a version tag can be repointed, so only the digest names a
              # fixed image.
              echo "Pin this in the root \`Dockerfile\` to deploy it:"
              echo ""
              echo "\`\`\`"
              echo "ARG JADAWEL_IMAGE=$digest"
              echo "\`\`\`"
            else
              echo "Could not read the digest; pin it from \`docker buildx imagetools inspect $IMAGE:$TAG\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
