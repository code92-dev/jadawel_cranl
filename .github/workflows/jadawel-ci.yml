name: Jadawel CI

# Self-contained CI for the Jadawel fork. Unlike upstream Jadawel's ci.yml (kept
# for reference but disabled — it pushes to Jadawel's own registry/SaaS and needs
# their secrets), this workflow builds and tests entirely within the job and needs
# no secrets, so it runs green on any fork.

# Runs on pull requests and on pushes to `main` and
# `codex/hostinger-coolify-deploy`. Manual-only was the previous setting, which
# meant nothing was gated at all.
#
# Note that `codex/hostinger-coolify-deploy` no longer auto-deploys anything:
# the Coolify instance it fed, jadawel.azoz.cloud, is switched off. It is still
# gated here because it costs nothing, but it is no longer the branch a release
# comes from — CranL releases from this repository's `main` branch after the
# image-publish and digest-pin steps in docs/DEPLOY_CRANL.md.
#
# `paths-ignore` keeps documentation-only commits from spending Actions minutes,
# which was the original reason for holding this back.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - codex/hostinger-coolify-deploy
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**/*.md"

concurrency:
  group: jadawel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
      - name: ruff check + format
        working-directory: backend
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

  backend-test:
    name: Backend smoke + fork-hygiene tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jadawel
          POSTGRES_PASSWORD: jadawel
          POSTGRES_DB: jadawel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jadawel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mcp-protection-redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: jadawel.config.settings.test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: jadawel
      DATABASE_USER: jadawel
      DATABASE_PASSWORD: jadawel
      JADAWEL_MCP_PROTECTION_REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: src:tests
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.29"
      - name: Install backend (frozen)
        working-directory: backend
        run: uv sync --frozen
      - name: Django system check
        working-directory: backend
        run: uv run python src/jadawel/manage.py check
      - name: Fork-hygiene tests (premium/enterprise must stay gone)
        working-directory: backend
        run: uv run pytest tests/arabase -q
      - name: Configure bounded MCP protection Redis
        run: |
          docker run --rm --network host redis:7-alpine redis-cli -h localhost CONFIG SET maxmemory 128mb
          docker run --rm --network host redis:7-alpine redis-cli -h localhost CONFIG SET maxmemory-policy noeviction
      - name: MCP protection strict check
        working-directory: backend
        run: |
          uv run python src/jadawel/manage.py migrate --noinput
          uv run python src/jadawel/manage.py mcp_protection_check --strict
      - name: MCP protection capacity canary
        working-directory: backend
        run: uv run python src/jadawel/manage.py mcp_protection_load --redis-url "$JADAWEL_MCP_PROTECTION_REDIS_URL" --yes
      - name: Full backend suite
        working-directory: backend
        run: uv run pytest tests -q -n 2

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        working-directory: web-frontend
        run: yarn install --frozen-lockfile
      - name: eslint + stylelint + prettier
        working-directory: web-frontend
        run: yarn lint

  frontend-locale-parity:
    name: Arabic locale parity (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Arabic locale parity
        working-directory: web-frontend
        run: node scripts/check-locale-parity.mjs --strict

  frontend-test:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install deps
        working-directory: web-frontend
        run: yarn install --frozen-lockfile
      - name: full vitest suite
        working-directory: web-frontend
        run: yarn test

  docker-build:
    name: Docker image build (backend + web-frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (ci target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web-frontend image (ci target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web-frontend/Dockerfile
          target: ci
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-e2e:
    name: Desktop E2E + production load gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          # The E2E job builds both application images and installs two browser
          # engines. Hosted runners do not have enough free disk once the
          # preinstalled mobile/.NET/Haskell toolchains are counted.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: extractions/setup-just@v3
      - name: Install Playwright and Chromium/Firefox dependencies
        working-directory: e2e-tests
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium firefox
      - name: Build E2E images
        run: just e2e build
      - name: Reclaim Docker build cache
        run: |
          # The tagged E2E images are complete at this point. Their intermediate
          # BuildKit cache can exceed the hosted runner's remaining disk before
          # PostgreSQL is pulled, so discard only that disposable cache.
          docker builder prune --all --force
          docker image prune --force
          df -h /
      - name: Run production load gate and desktop browser suites
        run: |
          just e2e up
          just e2e test
