[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jadawel-billing"
version = "0.1.0"
description = "Jadawel billing and administrator-managed entitlements"
requires-python = ">=3.14"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
