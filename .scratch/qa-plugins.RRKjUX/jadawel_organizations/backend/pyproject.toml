[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jadawel-organizations"
version = "0.1.0"
description = "Jadawel organization and team management"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["jadawel-billing>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
